spring.application.name=be-crm

# Profile: local (mặc định) nạp application-local.properties chứa secret khi chạy máy dev.
# Production (Render) đặt env SPRING_PROFILES_ACTIVE=prod và cấp secret qua biến môi trường.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Cổng server — Render inject biến PORT; local mặc định 8080
server.port=${PORT:8080}

# DataSource — giá trị nhạy cảm KHÔNG có default trong file commit;
# local lấy từ application-local.properties, production lấy từ env Render.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.open-in-view=false
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.hbm2ddl.auto=none

# JWT — secret KHÔNG có default (local: application-local.properties; prod: env APP_JWT_SECRET)
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Tắt auto-generated security password (dùng JWT thay cho HTTP Basic)
spring.security.user.name=disabled
spring.security.user.password=disabled

# Email — Gmail SMTP (dùng App Password). username/password KHÔNG có default.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# URL frontend để tạo activation link + link phản hồi báo giá
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# CORS — danh sách origin cho phép, phân tách bằng dấu phẩy (không được wildcard vì allowCredentials=true)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Font Unicode (hỗ trợ tiếng Việt) để sinh PDF báo giá.
# Mặc định trỏ font DejaVu trên Linux (deploy Docker cài fonts-dejavu).
# Chạy local Windows: application-local.properties đặt lại C:/Windows/Fonts/arial.ttf
app.pdf.font-path=${APP_PDF_FONT_PATH:/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf}

# AI Copilot (Gemini) — api-key KHÔNG có default (local: application-local.properties; prod: env APP_AI_API_KEY).
# model/base-url có default để chạy được ngay; đổi qua env nếu Google đổi tên model.
app.ai.api-key=${APP_AI_API_KEY:}
app.ai.model=${APP_AI_MODEL:gemini-flash-latest}
app.ai.base-url=${APP_AI_BASE_URL:https://generativelanguage.googleapis.com}

# Tim kiem ngu nghia (vector RAG) — backend chi NHUNG CAU HOI roi tra bang copilot_chunks.
# Viec danh chi muc du lieu do tools/indexer/ (Python) chay tay tren may dev dam nhiem.
# 🚨 model + dimensions PHAI TRUNG voi EMBED_MODEL/EMBED_DIMENSIONS ben indexer: moi model co
# he toa do rieng, lech nhau la ket qua tim kiem sai AM THAM (khong co loi nao duoc nem ra).
app.ai.embed.enabled=${APP_AI_EMBED_ENABLED:true}
app.ai.embed.model=${APP_AI_EMBED_MODEL:gemini-embedding-001}
app.ai.embed.dimensions=${APP_AI_EMBED_DIMENSIONS:768}
# So trich doan toi da nhoi vao prompt
app.ai.embed.top-k=${APP_AI_EMBED_TOP_K:6}
# Nguong khoang cach cosine: xa hon thi loai (tranh nhoi noi dung khong lien quan)
app.ai.embed.max-distance=${APP_AI_EMBED_MAX_DISTANCE:0.55}

# Đăng nhập Google — OAuth Client ID (Web) tạo ở Google Cloud Console. Dùng làm audience khi
# xác thực ID token. KHÔNG có default; thiếu thì endpoint /api/auth/google trả lỗi cấu hình.
app.google.client-id=${APP_GOOGLE_CLIENT_ID:}
